backend:
  name: github
  repo: haithamitc-arch/noor-albedaya-website
  branch: main
  base_url: https://api.netlify.com
  auth_type: implicit
  app_id: Iv1.xxxxxxxxxxxxxxx # أو اتركه فارغاً وسيتم الاعتماد على Netlify تلقائياً

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "صفحات الموقع"
    files:
      - file: "index.html"
        label: "الصفحة الرئيسية"
        name: "index"
        fields:
          - {label: "عنوان الموقع", name: "title", widget: "string"}
